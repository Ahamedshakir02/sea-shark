<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sea Shark Shipping Services LLC | Ship agent at Khorfakkan Port, UAE</title>
<meta name="description" content="Ship agent at Khorfakkan Port, UAE. Port calls, clearance, husbandry, crew changes, marine surveys and underwater hull work, coordinated by one team.">
<meta name="theme-color" content="#0a2540">
<link rel="preconnect" href="https://images.unsplash.com" crossorigin>
<link rel="dns-prefetch" href="https://images.unsplash.com">
<link rel="icon" href="/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
#loader{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;background:#0a2540;color:#fff;transition:opacity .6s cubic-bezier(.22,1,.36,1),visibility .6s;font-family:'Manrope Variable',system-ui,sans-serif}
#loader.is-done{opacity:0;visibility:hidden;pointer-events:none}
#loader.is-switch{transition-duration:.35s}
.ld__in{display:grid;justify-items:center;gap:6px;animation:ldIn .7s cubic-bezier(.22,1,.36,1) both}
.ld__wave{color:#f0a83a;margin-bottom:10px}
.ld__wave path{stroke-dasharray:140;stroke-dashoffset:140;animation:ldDraw 1.4s cubic-bezier(.65,0,.35,1) infinite alternate}
.ld__logo{width:min(260px,64vw);height:auto;margin-bottom:6px}
.ld__name{margin:0;font-size:1.5rem;font-weight:700;letter-spacing:.01em}
.ld__sub{margin:0;font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;opacity:.6}
.ld__bar{position:relative;width:140px;height:2px;margin-top:18px;background:rgba(255,255,255,.15);border-radius:2px;overflow:hidden}
.ld__bar span{position:absolute;inset:0;background:#f0a83a;transform-origin:left;animation:ldBar 1.6s cubic-bezier(.65,0,.35,1) infinite}
@keyframes ldIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes ldDraw{to{stroke-dashoffset:0}}
@keyframes ldBar{0%{transform:translateX(-100%) scaleX(.4)}100%{transform:translateX(250%) scaleX(.4)}}
@media (prefers-reduced-motion:reduce){.ld__in,.ld__wave path,.ld__bar span{animation:none}.ld__wave path{stroke-dashoffset:0}}
</style>
</head>
<body>
<div id="loader" aria-hidden="true">
  <div class="ld__in">
    <svg class="ld__wave" viewBox="0 0 120 24" width="120" height="24"><path d="M2 14 C 17 4, 27 4, 42 14 S 67 24, 82 14 S 107 4, 118 14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
    <img class="ld__logo" src="/logo-light.png" alt="Sea Shark Shipping Services LLC" width="992" height="211">
    <span class="ld__bar"><span></span></span>
  </div>
</div>
<div id="root"></div>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
