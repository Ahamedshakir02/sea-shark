<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="390" height="4993" viewBox="0 0 390 4993"><defs></defs><rect x="0" y="0" width="390" height="4993" fill="#ffffff"/><rect x="0" y="0" width="390" height="4992.7" fill="#ffffff"/><rect x="0" y="0" width="390" height="504" fill="#d4d4d4"/><rect x="0" y="0" width="390" height="504" fill="#e4e4e4"/><line x1="0" y1="0" x2="390" y2="504" stroke="#c2c2c2" stroke-width="1.5"/><line x1="390" y1="0" x2="0" y2="504" stroke="#c2c2c2" stroke-width="1.5"/><text x="20" y="179.3" font-family="Plus Jakarta Sans" font-size="13.6" font-weight="400" fill="#1f1f1f" fill-opacity="0.75">Home</text><text x="61.9" y="179.3" font-family="Plus Jakarta Sans" font-size="13.6" font-weight="400" fill="#1f1f1f" fill-opacity="0.75">/ Services</text><text x="20" y="219.7" font-family="Plus Jakarta Sans" font-size="13.1" font-weight="600" letter-spacing="0.8" fill="#1f1f1f" fill-opacity="0.85">[ SERVICES ]</text><text x="20" y="276.4" font-family="Plus Jakarta Sans" font-size="35.2" font-weight="600" letter-spacing="-0.9" fill="#1f1f1f">Everything a ship</text><text x="20" y="313.7" font-family="Plus Jakarta Sans" font-size="35.2" font-weight="600" letter-spacing="-0.9" fill="#1f1f1f">needs on the east</text><text x="20" y="351" font-family="Plus Jakarta Sans" font-size="35.2" font-weight="600" letter-spacing="-0.9" fill="#1f1f1f">coast.</text><text x="20" y="393.3" font-family="Plus Jakarta Sans" font-size="17.9" font-weight="400" fill="#1f1f1f" fill-opacity="0.9">Fresh water from our own barge, crew</text><text x="20" y="422.9" font-family="Plus Jakarta Sans" font-size="17.9" font-weight="400" fill="#1f1f1f" fill-opacity="0.9">boats arranged as your agent, and full</text><text x="20" y="452.4" font-family="Plus Jakarta Sans" font-size="17.9" font-weight="400" fill="#1f1f1f" fill-opacity="0.9">ship agency at Khorfakkan and Fujairah.</text><rect x="20" y="570" width="350" height="280" rx="28" fill="#e4e4e4"/><line x1="29.3" y1="579.3" x2="360.7" y2="840.7" stroke="#c2c2c2" stroke-width="1.5"/><line x1="360.7" y1="579.3" x2="29.3" y2="840.7" stroke="#c2c2c2" stroke-width="1.5"/><rect x="20" y="886" width="52" height="52" rx="16" fill="#fdfdfd"/><svg x="33" y="899" width="26" height="26" viewBox="0 0 24 24"><path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z" fill="none" stroke="#5c5c5c" stroke-width="1.6"></path></svg><text x="20" y="961" font-family="Plus Jakarta Sans" font-size="12.8" font-weight="600" letter-spacing="1.3" fill="#1f1f1f">01</text><text x="20" y="1005.1" font-family="Plus Jakarta Sans" font-size="32" font-weight="600" letter-spacing="-0.6" fill="#202020">Fresh water supply</text><text x="20" y="1046.3" font-family="Plus Jakarta Sans" font-size="17" font-weight="400" fill="#606060">Running low on fresh water should never</text><text x="20" y="1074.3" font-family="Plus Jakarta Sans" font-size="17" font-weight="400" fill="#606060">hold a ship up. Malik, our own water barge,</text><text x="20" y="1102.2" font-family="Plus Jakarta Sans" font-size="17" font-weight="400" fill="#606060">brings clean drinking water out to vessels at</text><text x="20" y="1130.2" font-family="Plus Jakarta Sans" font-size="17" font-weight="400" fill="#606060">Khorfakkan and Fujairah. Because we own</text><text x="20" y="1158.2" font-family="Plus Jakarta Sans" font-size="17" font-weight="400" fill="#606060">and run the barge ourselves, we set the</text><text x="20" y="1186.1" font-family="Plus Jakarta Sans" font-size="17" font-weight="400" fill="#606060">schedule, not a third party.</text><rect x="20" y="1219.1" width="22" height="22" rx="11" fill="#dedede"/><svg x="24" y="1223.1" width="14" height="14" viewBox="0 0 24 24"><path d="M5 12.5l4.2 4L19 7" fill="none" stroke="#1f1f1f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg><text x="54" y="1235.1" font-family="Plus Jakarta Sans" font-size="16" font-weight="400" fill="#202020">Drinking water delivered by our own</text><text x="54" y="1261.5" font-family="Plus Jakarta Sans" font-size="16" font-weight="400" fill="#202020">barge, Malik</text><rect x="20" y="1281.9" width="22" height="22" rx="11" fill="#dedede"/><svg x="24" y="1285.9" width="14" height="14" viewBox="0 0 24 24"><path d="M5 12.5l4.2 4L19 7" fill="none" stroke="#1f1f1f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg><text x="54" y="1297.9" font-family="Plus Jakarta Sans" font-size="16" font-weight="400" fill="#202020">Supply to ships at anchor</text><rect x="20" y="1318.3" width="22" height="22" rx="11" fill="#dedede"/><svg x="24" y="1322.3" width="14" height="14" viewBox="0 0 24 24"><path d="M5 12.5l4.2 4L19 7" fill="none" stroke="#1f1f1f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg><rect x="253.5" y="1318.6" width="95.4" height="22.9" rx="11.4" fill="#f2f2f2" fill-opacity="0.22"/><rect x="254" y="1319.1" width="94.4" height="21.9" rx="10.9" fill="none" stroke="#c7c7c7" stroke-width="1" stroke-dasharray="4 3"/><text x="54" y="1334.3" font-family="Plus Jakarta Sans" font-size="16" font-weight="400" fill="#202020">Supply to ships alongside</text><text x="263.5" y="1333.6" font-family="Plus Jakarta Sans" font-size="10.9" font-weight="600" letter-spacing="0.7" fill="#606060">TO CONFIRM</text><rect x="20" y="1367.7" width="137" height="54.4" rx="27.2" fill="#d2d2d2"/><text x="46" y="1400.7" font-family="Plus Jakarta Sans" font-size="16" font-weight="600" fill="#1f1f1f">See details</text><text x="20" y="1463.1" font-family="Plus Jakarta Sans" font-size="16" font-weight="600" fill="#4a4a4a">Order water on WhatsApp →</text><rect x="20" y="1540.5" width="350" height="280" rx="28" fill="#e4e4e4"/><line x1="29.3" y1="1549.8" x2="360.7" y2="1811.1" stroke="#c2c2c2" stroke-width="1.5"/><line x1="360.7" y1="1549.8" x2="29.3" y2="1811.1" stroke="#c2c2c2" stroke-width="1.5"/><rect x="20" y="1856.5" width="52" height="52" rx="16" fill="#fdfdfd"/><svg x="33" y="1869.5" width="26" height="26" viewBox="0 0 24 24"><path d="M3 15h18l-2.5 4h-13zM6 15V9h9l3 6M9 9V6h4v3" fill="none" stroke="#5c5c5c" stroke-width="1.6" stroke-linejoin="round"></path></svg><text x="20" y="1931.5" font-family="Plus Jakarta Sans" font-size="12.8" font-weight="600" letter-spacing="1.3" fill="#1f1f1f">02</text><text x="20" y="1975.6" font-family="Plus Jakarta Sans" font-size="32" font-weight="600" letter-spacing="-0.6" fill="#202020">Crew boat service</text><text x="20" y="2016.8" font-family="Plus Jakarta Sans" font-size="17" font-weight="400" fill="#606060">Crew changes and small deliveries are often</text><text x="20" y="2044.7" font-family="Plus Jakarta Sans" font-size="17" font-weight="400" fill="#606060">planned around tight windows. As your</text><text x="20" y="2072.7" font-family="Plus Jakarta Sans" font-size="17" font-weight="400" fill="#606060">agent, we arrange crew boats at Khorfakkan</text><text x="20" y="2100.7" font-family="Plus Jakarta Sans" font-size="17" font-weight="400" fill="#606060">and Fujairah to move people, stores and</text><text x="20" y="2128.6" font-family="Plus Jakarta Sans" font-size="17" font-weight="400" fill="#606060">light cargo between shore and ship, and we</text><text x="20" y="2156.6" font-family="Plus Jakarta Sans" font-size="17" font-weight="400" fill="#606060">keep you updated until the job is done.</text><rect x="20" y="2189.6" width="22" height="22" rx="11" fill="#dedede"/><svg x="24" y="2193.6" width="14" height="14" viewBox="0 0 24 24"><path d="M5 12.5l4.2 4L19 7" fill="none" stroke="#1f1f1f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg><text x="54" y="2205.6" font-family="Plus Jakarta Sans" font-size="16" font-weight="400" fill="#202020">Crew changes, sign-on and sign-off</text><rect x="20" y="2226" width="22" height="22" rx="11" fill="#dedede"/><svg x="24" y="2230" width="14" height="14" viewBox="0 0 24 24"><path d="M5 12.5l4.2 4L19 7" fill="none" stroke="#1f1f1f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg><text x="54" y="2242" font-family="Plus Jakarta Sans" font-size="16" font-weight="400" fill="#202020">Crew transfers between shore and ship</text><rect x="20" y="2262.3" width="22" height="22" rx="11" fill="#dedede"/><svg x="24" y="2266.3" width="14" height="14" viewBox="0 0 24 24"><path d="M5 12.5l4.2 4L19 7" fill="none" stroke="#1f1f1f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg><text x="54" y="2278.3" font-family="Plus Jakarta Sans" font-size="16" font-weight="400" fill="#202020">Delivery of ship stores and spare parts</text><rect x="20" y="2311.7" width="137" height="54.4" rx="27.2" fill="#d2d2d2"/><text x="46" y="2344.7" font-family="Plus Jakarta Sans" font-size="16" font-weight="600" fill="#1f1f1f">See details</text><text x="179" y="2344.7" font-family="Plus Jakarta Sans" font-size="16" font-weight="600" fill="#4a4a4a">Book a crew boat →</text><rect x="20" y="2436.1" width="350" height="280" rx="28" fill="#e4e4e4"/><line x1="29.3" y1="2445.5" x2="360.7" y2="2706.8" stroke="#c2c2c2" stroke-width="1.5"/><line x1="360.7" y1="2445.5" x2="29.3" y2="2706.8" stroke="#c2c2c2" stroke-width="1.5"/><rect x="20" y="2752.1" width="52" height="52" rx="16" fill="#fdfdfd"/><svg x="33" y="2765.1" width="26" height="26" viewBox="0 0 24 24"><path d="M12 3v15M7 7h10M5 14a7 7 0 0 0 14 0M12 18v3" fill="none" stroke="#5c5c5c" stroke-width="1.6" stroke-linecap="round"></path><circle cx="12" cy="4" r="1.6" fill="none" stroke="#5c5c5c" stroke-width="1.6"></circle></svg><text x="20" y="2827.1" font-family="Plus Jakarta Sans" font-size="12.8" font-weight="600" letter-spacing="1.3" fill="#1f1f1f">03</text><text x="20" y="2871.2" font-family="Plus Jakarta Sans" font-size="32" font-weight="600" letter-spacing="-0.6" fill="#202020">Ship agency</text><text x="20" y="2912.4" font-family="Plus Jakarta Sans" font-size="17" font-weight="400" fill="#606060">A port call has many moving parts. We act as</text><text x="20" y="2940.4" font-family="Plus Jakarta Sans" font-size="17" font-weight="400" fill="#606060">your agent on the UAE east coast, so</text><text x="20" y="2968.4" font-family="Plus Jakarta Sans" font-size="17" font-weight="400" fill="#606060">owners, operators and masters deal with</text><text x="20" y="2996.3" font-family="Plus Jakarta Sans" font-size="17" font-weight="400" fill="#606060">one team that coordinates the call, handles</text><text x="20" y="3024.3" font-family="Plus Jakarta Sans" font-size="17" font-weight="400" fill="#606060">the paperwork and keeps everyone</text><text x="20" y="3052.3" font-family="Plus Jakarta Sans" font-size="17" font-weight="400" fill="#606060">informed.</text><rect x="20" y="3085.2" width="22" height="22" rx="11" fill="#dedede"/><svg x="24" y="3089.2" width="14" height="14" viewBox="0 0 24 24"><path d="M5 12.5l4.2 4L19 7" fill="none" stroke="#1f1f1f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg><text x="54" y="3101.2" font-family="Plus Jakarta Sans" font-size="16" font-weight="400" fill="#202020">Port call coordination with the port and</text><text x="54" y="3127.6" font-family="Plus Jakarta Sans" font-size="16" font-weight="400" fill="#202020">local parties</text><rect x="20" y="3148" width="22" height="22" rx="11" fill="#dedede"/><svg x="24" y="3152" width="14" height="14" viewBox="0 0 24 24"><path d="M5 12.5l4.2 4L19 7" fill="none" stroke="#1f1f1f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg><rect x="124.7" y="3174.7" width="95.4" height="22.9" rx="11.4" fill="#f2f2f2" fill-opacity="0.22"/><rect x="125.2" y="3175.2" width="94.4" height="21.9" rx="10.9" fill="none" stroke="#c7c7c7" stroke-width="1" stroke-dasharray="4 3"/><text x="54" y="3164" font-family="Plus Jakarta Sans" font-size="16" font-weight="400" fill="#202020">Husbandry: crew changes, stores and</text><text x="54" y="3190.4" font-family="Plus Jakarta Sans" font-size="16" font-weight="400" fill="#202020">supplies</text><text x="134.7" y="3189.7" font-family="Plus Jakarta Sans" font-size="10.9" font-weight="600" letter-spacing="0.7" fill="#606060">TO CONFIRM</text><rect x="20" y="3210.8" width="22" height="22" rx="11" fill="#dedede"/><svg x="24" y="3214.8" width="14" height="14" viewBox="0 0 24 24"><path d="M5 12.5l4.2 4L19 7" fill="none" stroke="#1f1f1f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg><text x="54" y="3226.8" font-family="Plus Jakarta Sans" font-size="16" font-weight="400" fill="#202020">Surveys and technical support</text><rect x="20" y="3260.2" width="137" height="54.4" rx="27.2" fill="#d2d2d2"/><text x="46" y="3293.2" font-family="Plus Jakarta Sans" font-size="16" font-weight="600" fill="#1f1f1f">See details</text><text x="179" y="3293.2" font-family="Plus Jakarta Sans" font-size="16" font-weight="600" fill="#4a4a4a">Ask about agency →</text><rect x="20" y="3380.6" width="350" height="421.1" rx="32" fill="#d4d4d4"/><rect x="20" y="3380.6" width="350" height="421.1" rx="32" fill="#e4e4e4"/><line x1="30.7" y1="3391.2" x2="359.3" y2="3791" stroke="#c2c2c2" stroke-width="1.5"/><line x1="359.3" y1="3391.2" x2="30.7" y2="3791" stroke="#c2c2c2" stroke-width="1.5"/><text x="48" y="3458.6" font-family="Plus Jakarta Sans" font-size="32" font-weight="600" letter-spacing="-0.6" fill="#1f1f1f">Need water, a crew</text><text x="48" y="3493.8" font-family="Plus Jakarta Sans" font-size="32" font-weight="600" letter-spacing="-0.6" fill="#1f1f1f">boat or an agent</text><text x="48" y="3529" font-family="Plus Jakarta Sans" font-size="32" font-weight="600" letter-spacing="-0.6" fill="#1f1f1f">today?</text><text x="48" y="3567.1" font-family="Plus Jakarta Sans" font-size="16" font-weight="400" fill="#1f1f1f" fill-opacity="0.88">Send us your vessel name and location</text><text x="48" y="3593.5" font-family="Plus Jakarta Sans" font-size="16" font-weight="400" fill="#1f1f1f" fill-opacity="0.88">on WhatsApp, and we'll sort it out.</text><rect x="48" y="3630.9" width="294" height="54.4" rx="27.2" fill="#ffffff"/><rect x="86.4" y="3653.1" width="10" height="10" rx="5" fill="#e9e9e9"/><text x="106.4" y="3663.9" font-family="Plus Jakarta Sans" font-size="16" font-weight="600" fill="#202020">Message us on WhatsApp</text><rect x="48.5" y="3697.8" width="293" height="55.4" rx="27.7" fill="none" stroke="#c7c7c7" stroke-width="1" stroke-opacity="0.6"/><text x="113.9" y="3731.3" font-family="Plus Jakarta Sans" font-size="16" font-weight="600" fill="#1f1f1f">Call +971 56 673 5968</text><rect x="0" y="3901.7" width="390" height="1091" fill="#d0d0d0"/><rect x="20" y="4807.2" width="350" height="1" fill="#c7c7c7" fill-opacity="0.12"/><svg x="20" y="3971.7" width="34" height="34" viewBox="0 0 40 40"><path d="M4 27c5 0 7-3 10-3s5 3 10 3 7-3 12-3" fill="none" stroke="#1f1f1f" stroke-width="2.6" stroke-linecap="round"></path><path d="M14 22 22 6l4 16z" fill="#1f1f1f"></path></svg><text x="64" y="3988.9" font-family="Plus Jakarta Sans" font-size="17.6" font-weight="700" fill="#1f1f1f">Sea Shark</text><text x="64" y="4003.2" font-family="Plus Jakarta Sans" font-size="11.2" font-weight="500" fill="#1f1f1f" fill-opacity="0.75">Shipping Services LLC</text><text x="20" y="4039.7" font-family="Plus Jakarta Sans" font-size="14.7" font-weight="400" fill="#1f1f1f" fill-opacity="0.7">Fresh water supply, crew boats and ship</text><text x="20" y="4064" font-family="Plus Jakarta Sans" font-size="14.7" font-weight="400" fill="#1f1f1f" fill-opacity="0.7">agency at Khorfakkan and Fujairah, UAE.</text><text x="20" y="4129.3" font-family="Plus Jakarta Sans" font-size="15.2" font-weight="700" fill="#1f1f1f">Pages</text><text x="20" y="4170.3" font-family="Plus Jakarta Sans" font-size="14.7" font-weight="400" fill="#1f1f1f" fill-opacity="0.7">Home</text><text x="20" y="4208.6" font-family="Plus Jakarta Sans" font-size="14.7" font-weight="400" fill="#1f1f1f" fill-opacity="0.7">Services</text><text x="20" y="4246.