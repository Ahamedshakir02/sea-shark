xt><text x="20" y="4886.4" font-family="Plus Jakarta Sans" font-size="14.7" font-weight="400" fill="#1f1f1f" fill-opacity="0.7">Back to top ↑</text><svg x="20" y="21" width="34" height="34" viewBox="0 0 40 40"><path d="M4 27c5 0 7-3 10-3s5 3 10 3 7-3 12-3" fill="none" stroke="#1f1f1f" stroke-width="2.6" stroke-linecap="round"></path><path d="M14 22 22 6l4 16z" fill="#1f1f1f"></path></svg><text x="64" y="38.2" font-family="Plus Jakarta Sans" font-size="17.6" font-weight="700" fill="#1f1f1f">Sea Shark</text><text x="64" y="52.5" font-family="Plus Jakarta Sans" font-size="11.2" font-weight="500" fill="#1f1f1f" fill-opacity="0.75">Shipping Services LLC</text><rect x="298.2" y="20.5" width="71.3" height="35" rx="17.5" fill="none" stroke="#c7c7c7" stroke-width="1"/><text x="314.7" y="44" font-family="Plus Jakarta Sans" font-size="14.4" font-weight="600" fill="#1f1f1f">Menu</text><rect x="308" y="818" width="60" height="60" rx="30" fill="#e9e9e9"/><rect x="292.8" y="802.8" width="90.5" height="90.5" rx="45.2" fill="none" stroke="#c7c7c7" stroke-width="2" stroke-opacity="0.079"/><svg x="322" y="832" width="32" height="32" viewBox="0 0 32 32"><path fill="#1f1f1f" d="M16 3a13 13 0 0 0-11.2 19.6L3 29l6.6-1.7A13 13 0 1 0 16 3zm0 23.7c-2 0-4-.6-5.7-1.6l-.4-.2-3.9 1 1-3.8-.3-.4A10.7 10.7 0 1 1 16 26.7zm5.9-8c-.3-.2-1.9-1-2.2-1s-.5-.2-.7.2-.8 1-1 1.2-.4.2-.7 0a8.8 8.8 0 0 1-4.4-3.8c-.3-.6.3-.5 1-1.7.1-.2 0-.4 0-.6l-1-2.4c-.3-.6-.5-.5-.7-.5h-.6c-.2 0-.6.1-.9.4s-1.2 1.1-1.2 2.8 1.2 3.3 1.4 3.5 2.4 3.6 5.8 5c2.1.9 3 1 4 .8.7-.1 1.9-.8 2.2-1.5s.3-1.3.2-1.5-.3-.2-.6-.4z"></path></svg></svg>